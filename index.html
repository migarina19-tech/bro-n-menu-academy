<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4fa3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BRO&N Menu Academy — by Arina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">BRO&N</div>
      <h1>Menu Academy</h1>
      <p class="creator">создано тобой · by Arina</p>
    </div>
    <div class="heart-wrap">
      <button class="heart" id="heartButton" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="quickMenu">♥</button>
      <div class="quick-menu" id="quickMenu" hidden>
        <button type="button" class="quick-menu-item" data-quick-action="menu">
          <span class="quick-icon">▣</span>
          <span><b>Карточки для изучения</b><small>Изучать блюда и описания</small></span>
        </button>
        <button type="button" class="quick-menu-item" data-quick-action="results">
          <span class="quick-icon">↗</span>
          <span><b>Результаты</b><small>Мой прогресс и баллы</small></span>
        </button>
        <button type="button" class="quick-menu-item" data-quick-action="tests">
          <span class="quick-icon">✓</span>
          <span><b>Тесты</b><small>Проверить знания</small></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero card">
      <span class="pill">Домашняя итальянская кухня</span>
      <h2>Выучи меню.<br><span>Уверенно обслуживай.</span></h2>
      <p>Учебная платформа для подготовки официантов BRO&N.</p>
      <button class="primary" id="startButton" type="button">Начать обучение</button>
    </section>

    <section class="progress card">
      <div class="section-head">
        <h3>Мой прогресс</h3>
        <strong id="progressPercent">0%</strong>
      </div>
      <div class="bar"><div id="progressBar"></div></div>
      <p id="progressText">Материалы ещё не изучены</p>
    </section>

    <section class="grid">
      <button class="tile card" id="menuButton" type="button">
        <span class="tile-icon">🍝</span>
        <b>Изучение меню</b>
        <small>Карточки блюд и описание</small>
      </button>
      <button class="tile card" id="testsButton" type="button">
        <span class="tile-icon">✓</span>
        <b>Тестирование</b>
        <small>Проверка знаний</small>
      </button>
      <button class="tile card" id="resultsButton" type="button">
        <span class="tile-icon">↗</span>
        <b>Результаты</b>
        <small>Баллы и прогресс</small>
      </button>
    </section>

    <section id="content" class="card content" aria-live="polite"></section>
  </main>

  <footer>
    <span>BRO&N Menu Academy</span>
    <span>by Arina</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
